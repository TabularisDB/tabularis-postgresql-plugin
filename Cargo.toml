[package]
name = "postgresql-plugin"
version = "0.1.0"
edition = "2021"
description = "PostgreSQL plugin driver for Tabularis"
publish = false

[[bin]]
name = "postgresql-plugin"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1", "array-impls"] }
deadpool-postgres = "0.14"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-platform-verifier = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.20", features = ["v4", "serde"] }
rust_decimal = { version = "1.36", features = ["db-tokio-postgres", "serde"] }
async-trait = "0.1"
log = "0.4"
base64 = "0.22.1"
infer = "0.16"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
